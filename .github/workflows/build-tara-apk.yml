name: Build Tara Learning APK

on:
  workflow_dispatch:
  push:
    paths:
      - "kids-app/**"
      - ".github/workflows/build-tara-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kids-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        run: npm install

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Landscape, microphone (Recording Studio) and TTS permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' $M
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n</manifest>#' $M
          grep -n "screenOrientation\|RECORD_AUDIO\|TTS_SERVICE" $M

      - name: Use the repository's fixed debug key (updates install over old versions and keep progress)
        run: |
          mkdir -p ~/.android
          cp ../debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Tara-Learning.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tara-Learning-apk
          path: kids-app/Tara-Learning.apk
