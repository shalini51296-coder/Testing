name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Locate files & Prepare project
      run: |
        if [ ! -f "package.json" ]; then
          SUBDIR=$(find . -mindepth 2 -maxdepth 2 -name "package.json" | head -n 1 | xargs dirname)
          if [ -n "$SUBDIR" ]; then
            echo "Found project in subfolder: $SUBDIR"
            cp -r $SUBDIR/* .
          fi
        fi

    - name: Install dependencies & Build Web
      run: |
        npm install
        node build-web.js || npm run build || true

    - name: Setup & Sync Capacitor Android
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
