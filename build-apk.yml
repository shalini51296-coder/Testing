name: Build Android APK

on:
  workflow_dispatch:        # manual "Run workflow" button
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build offline web assets (Tailwind + Font Awesome)
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icon and splash screen
        run: npx capacitor-assets generate --android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Use fixed signing key (so updates install over old versions)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Keep classic status-bar layout (target SDK 34)
        run: sed -i 's/targetSdkVersion = 35/targetSdkVersion = 34/' android/variables.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Super-TET-2026.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Super-TET-2026-apk
          path: dist/Super-TET-2026.apk
          if-no-files-found: error
